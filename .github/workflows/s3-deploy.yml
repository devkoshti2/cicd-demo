name: S3 Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v3

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: S3 Pe Deploy
        run: aws s3 sync . s3://dev-koshti-website-2026 --exclude ".git/*" --exclude ".github/*"

      - name: Success
        run: echo "Website S3 pe successfully deployed!"
